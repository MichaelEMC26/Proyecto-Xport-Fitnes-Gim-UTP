# Agente de huella ZK9500 - configuración
# Copie este archivo junto a agente-huella.jar en la PC de recepción.

# Puerto local (la página web llama a http://127.0.0.1:<puerto>). Si lo cambia, cambie también
# HUELLA_AGENTE en src/main/webapp/js/huella-zk.js
puerto=8095

# Direcciones (origen = protocolo://dominio[:puerto]) desde donde se abre la aplicación web.
# Solo esas páginas pueden usar el lector. Separe varias con coma. Ejemplo para producción:
#   origenes=https://www.midominio.com,https://midominio.com,http://localhost:8080
origenes=http://localhost:8080,http://127.0.0.1:8080
